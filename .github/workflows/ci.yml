name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m pytest tests/ -v --tb=short -m "not win32" --cov=docx_editor --cov-report=term

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/ -v --tb=short --cov=docx_editor --cov-report=term

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install flake8
      - name: Lint
        run: |
          flake8 docx_editor/ --max-line-length=100 --count --show-source --statistics
