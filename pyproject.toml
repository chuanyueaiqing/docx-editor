[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "docx-editor"
version = "0.1.0"
description = "A Python library for DOCX editing with chapter-based access, markdown conversion, format analysis, and tracked changes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "chenxiaochuan", email = "415768667@qq.com"},
]
keywords = ["docx", "word", "markdown", "chapter", "office", "win32com", "wps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
win32 = ["pywin32"]
images = ["Pillow"]
mermaid = []
all = ["docx-editor[win32,images,mermaid]"]

[project.urls]
Homepage = "https://github.com/chuanyuepingfang/docx-editor"
Repository = "https://github.com/chuanyuepingfang/docx-editor"
Documentation = "https://github.com/chuanyuepingfang/docx-editor#readme"

[tool.setuptools.packages.find]
include = ["docx_editor*"]

[tool.setuptools.package-data]
docx_editor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "win32: tests requiring win32com (Windows only)",
    "integration: integration tests",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["docx_editor"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
